<!-- Reusable UI Feedback System: Toasts (stacked, bottom-right) + Modal (centered).
     Source of truth for markup. Mirror block is injected into index.html.
     Theme: Apple Modern Precision Light — surface-container-lowest, rounded-2xl,
     border-black/[0.06], material-symbols-outlined, font-* tokens from tailwind config. -->

<!-- Toast stack: fixed bottom-right, above all views -->
<div id="toast-container" class="fixed bottom-4 right-4 z-[9999] flex flex-col gap-2 items-end pointer-events-none" aria-live="polite"></div>

<!-- Modal overlay: centered dialog for success / error / confirm -->
<div id="modal-overlay" class="fixed inset-0 z-[10000] hidden items-center justify-center p-4">
  <div id="modal-backdrop" class="absolute inset-0 bg-on-surface/30 backdrop-blur-[2px]"></div>
  <div id="modal-card" role="dialog" aria-modal="true"
    class="relative w-full max-w-sm bg-surface-container-lowest rounded-2xl border border-black/[0.06] shadow-[0_8px_30px_rgba(0,0,0,0.12)] p-space-lg flex flex-col items-center text-center gap-2">
    <div id="modal-icon-wrap" class="w-12 h-12 rounded-2xl flex items-center justify-center shadow-sm">
      <span id="modal-icon" class="material-symbols-outlined text-[26px]">check_circle</span>
    </div>
    <h3 id="modal-title" class="font-headline-md text-headline-md text-on-surface">Done</h3>
    <p id="modal-message" class="font-body-md text-body-md text-on-surface-variant leading-relaxed"></p>
    <p id="modal-details" class="hidden font-mono-data text-mono-data text-outline bg-surface-container-low border border-black/[0.04] rounded-lg px-2.5 py-1.5 max-w-full break-all"></p>
    <div id="modal-actions" class="flex items-center justify-center gap-2 mt-2 w-full"></div>
  </div>
</div>
