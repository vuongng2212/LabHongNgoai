<div
  id="toast-container"
  class="fixed bottom-4 right-4 z-[9999] flex flex-col gap-2 items-end pointer-events-none"
  aria-live="polite"
></div>
<div
  id="modal-overlay"
  class="fixed inset-0 z-[10000] hidden items-center justify-center p-4"
>
  <div
    id="modal-backdrop"
    class="ui-modal-backdrop absolute inset-0 bg-slate-900/60"
  ></div>
  <div
    id="modal-card"
    role="dialog"
    aria-modal="true"
    class="relative w-full max-w-lg bg-white rounded-xl shadow-2xl border border-slate-200 p-6 flex flex-col gap-4 z-10 select-none text-left"
  >
    <div class="flex items-center justify-between pb-3 border-b border-slate-100">
      <div class="flex items-center gap-3">
        <div
          id="modal-icon-wrap"
          class="w-10 h-10 rounded-lg bg-amber-50 text-amber-600 border border-amber-200 flex items-center justify-center shrink-0 shadow-xs"
        >
          <span id="modal-icon" class="material-symbols-outlined text-[22px]">warning</span>
        </div>
        <div class="min-w-0">
          <h3
            id="modal-title"
            class="text-base font-bold text-slate-900 leading-snug"
          >
            Cảnh báo mất tín hiệu quang (LOS Blocked)
          </h3>
          <p
            id="modal-subtitle"
            class="text-[11px] font-mono font-medium text-slate-500 uppercase tracking-wider"
          >
            OPTICAL LINK • STATUS ALERT
          </p>
        </div>
      </div>
      <button
        id="modal-close-btn"
        class="p-1 rounded-md text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer"
        title="Đóng hộp thoại"
      >
        <span class="material-symbols-outlined text-[18px]">close</span>
      </button>
    </div>
    <div class="space-y-3">
      <p
        id="modal-message"
        class="text-sm font-medium text-slate-800 leading-relaxed break-words"
      ></p>
      <div
        id="modal-details"
        class="hidden font-mono text-xs text-slate-700 bg-slate-50 border border-slate-200 rounded-lg p-3.5 space-y-1.5 leading-relaxed break-words whitespace-pre-wrap select-text"
      ></div>
    </div>
    <div
      id="modal-actions"
      class="flex items-center justify-end gap-3 pt-2 border-t border-slate-100"
    ></div>
  </div>
</div>
