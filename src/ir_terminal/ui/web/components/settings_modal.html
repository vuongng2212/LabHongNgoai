<!-- Transfer Settings Modal: source of truth. Mirrored into index.html by build.
     Theme: Apple Modern Precision Light — surface-container-lowest, rounded-2xl,
     border-black/[0.06], material-symbols-outlined, Plus Jakarta Sans / Inter tokens. -->
<div id="settings-overlay" class="fixed inset-0 z-[10000] hidden items-center justify-center p-4">
  <div id="settings-backdrop" class="absolute inset-0 bg-on-surface/30 backdrop-blur-[2px]"></div>
  <div id="settings-card" role="dialog" aria-modal="true" aria-labelledby="settings-title"
    class="relative w-full max-w-md bg-surface-container-lowest rounded-2xl border border-black/[0.06] shadow-[0_8px_30px_rgba(0,0,0,0.12)] p-space-lg flex flex-col gap-space-md">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-space-sm">
        <div class="w-10 h-10 rounded-xl bg-surface-container text-primary flex items-center justify-center shadow-sm">
          <span class="material-symbols-outlined text-[22px]">settings</span>
        </div>
        <div>
          <h3 id="settings-title" class="font-headline-md text-headline-md text-on-surface">Transfer Settings</h3>
          <p class="font-mono-caption text-mono-caption text-on-surface-variant">OPTICAL LINK • PERSISTED LOCALLY</p>
        </div>
      </div>
      <button id="settings-close" class="p-1 rounded hover:bg-surface-container-high text-on-surface-variant transition-colors cursor-pointer" title="Close settings">
        <span class="material-symbols-outlined text-[18px]">close</span>
      </button>
    </div>
    <div class="space-y-space-md">
      <div class="space-y-1.5">
        <label for="settings-max-mb" class="block font-label-sm text-label-sm text-on-surface-variant font-medium">Max file transfer limit (MB)</label>
        <input id="settings-max-mb" type="number" min="1" max="100" step="1" value="10"
          class="w-full bg-[#FFFFFF] border border-black/[0.12] rounded-lg px-3 py-1.5 text-on-surface font-mono-data text-mono-data focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" />
        <p class="font-mono-caption text-mono-caption text-outline">Allowed range: 1 – 100 MB. Default: 10 MB.</p>
      </div>
      <div class="space-y-1.5">
        <label for="settings-dir" class="block font-label-sm text-label-sm text-on-surface-variant font-medium">Default receive directory</label>
        <div class="flex items-center gap-2">
          <input id="settings-dir" type="text" placeholder="Transfers directory path" readonly
            class="flex-1 bg-surface-container-low border border-black/[0.12] rounded-lg px-3 py-1.5 text-on-surface font-mono-data text-mono-data focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" />
          <button id="settings-browse" class="h-[32px] px-space-md bg-white hover:bg-[#F8FAFC] text-on-surface border border-black/[0.12] rounded-lg font-title-sm text-title-sm font-medium flex items-center gap-1.5 active:scale-[0.98] transition-all cursor-pointer">
            <span class="material-symbols-outlined text-[16px]">folder_open</span>
            <span>Browse</span>
          </button>
        </div>
      </div>
      <p id="settings-error" class="hidden font-body-md text-body-md text-error"></p>
    </div>
    <div class="flex items-center justify-end gap-space-sm pt-space-xs border-t border-black/[0.04]">
      <button id="settings-cancel" class="h-[32px] px-space-md bg-white hover:bg-[#F8FAFC] text-on-surface border border-black/[0.12] rounded-lg font-title-sm text-title-sm font-medium active:scale-[0.98] transition-all cursor-pointer">
        Cancel
      </button>
      <button id="settings-save" class="h-[32px] px-space-md bg-primary-container hover:bg-primary text-white font-title-sm text-title-sm font-semibold rounded-lg shadow-sm active:scale-[0.98] transition-all cursor-pointer">
        Save
      </button>
    </div>
  </div>
</div>
